<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home Maintenance Tracker - Mobile</title>
  <link rel="stylesheet" href="mobile.css" />
  <script>
    window.GOOGLE_OAUTH_CLIENT_ID = '902309416260-4v04g0nc6fa4lt9otb2gm4ijkfhgoc1s.apps.googleusercontent.com';
    window.GOOGLE_SPREADSHEET_ID = '18la6E47KuiFWXFSIASd8QYbvxEo-ZJ7RaxnnuxIml9k';
  </script>
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Home Maintenance Tracker <span id="item-counter" class="item-counter"></span></h1>
      <p>Mobile view for property tasks</p>
    </div>
    <button id="refresh-button" type="button">Refresh</button>
  </header>

  <section class="controls">
    <input id="search-input" type="search" placeholder="Search tasks..." />
    <div class="filter-row">
      <div class="filter-group">
        <label for="filter-property">Property</label>
        <select id="filter-property" multiple size="1">
          <option value="">All Properties</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="filter-priority">Priority</label>
        <select id="filter-priority" multiple size="1">
          <option value="">All Priorities</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="filter-category">Category</label>
        <select id="filter-category" multiple size="1">
          <option value="">All Categories</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="filter-area">Area</label>
        <select id="filter-area" multiple size="1">
          <option value="">All Areas</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="filter-state">State</label>
        <select id="filter-state" multiple size="1">
          <option value="">All States</option>
        </select>
      </div>
    </div>
  </section>

  <section class="task-actions">
    <button id="open-add-form" type="button">Add Task</button>
    <button id="project-list-button" class="project-list-button" type="button">Project List</button>
    <button id="sort-order" type="button">Sort Ascending</button>
  </section>

  <main id="task-container"></main>

  <div id="task-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title">Add Task</h2>
      <form id="task-form">
          <div class="form-grid">
          <label>Property<select name="property" required></select></label>
          
          <label>Area<select name="area"></select></label>
          <label>Category<select name="category"></select></label>
          <label>Task Description<textarea name="description" required></textarea></label>
          <label>Priority<select name="priority">
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select></label>
          <label>Order<input name="order" /></label>
          <label>Cost ($)<input name="cost" type="number" step="0.01" min="0" /></label>
          <label>State<select name="state">
              <option value="Pending">Pending</option>
              <option value="In Progress">In Progress</option>
              <option value="Complete">Complete</option>
            </select></label>
        </div>
        <div class="form-actions">
          <button type="submit">Save Task</button>
          <button id="close-modal" type="button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div id="projectDrawer" class="project-drawer" aria-hidden="true">
    <div class="project-drawer-header">
      <h2>Project List</h2>
      <button id="close-project-drawer" type="button" aria-label="Close project list">X</button>
    </div>
    <div id="project-drawer-content" class="project-drawer-content"></div>
  </div>

  <script type="module" src="mobile.js"></script>
</body>
</html>
