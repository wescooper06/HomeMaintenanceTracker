<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home Maintenance Tracker - Dashboard</title>
  <link rel="stylesheet" href="dashboard.css" />
  <script>
    window.GOOGLE_OAUTH_CLIENT_ID = '902309416260-4v04g0nc6fa4lt9otb2gm4ijkfhgoc1s.apps.googleusercontent.com';
    window.GOOGLE_SPREADSHEET_ID = '18la6E47KuiFWXFSIASd8QYbvxEo-ZJ7RaxnnuxIml9k';
  </script>
</head>
<body>
  <header class="dashboard-header">
    <div>
      <h1>Home Maintenance Dashboard</h1>
      <p>Full table view with filters, bulk edits, and charts.</p>
    </div>
    <div class="header-actions">
      <button id="open-add-form" type="button">Add Task</button>
      <button id="delete-selected" type="button">Delete Selected</button>
      <button id="refresh-data">Refresh</button>
    </div>
  </header>

  <section class="dashboard-filters">
    <input id="dashboard-search" type="search" placeholder="Search tasks..." />
    <div class="dashboard-controls">
      <select id="dashboard-property-filter">
        <option value="">All Properties</option>
      </select>
      <select id="dashboard-priority-filter">
        <option value="">All Priorities</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select>
      <select id="dashboard-category-filter">
        <option value="">All Categories</option>
      </select>
    </div>
  </section>

  <section class="bulk-actions">
    <div>
      <label>Bulk state:<select id="bulk-state">
        <option value="">Choose state</option>
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Complete">Complete</option>
      </select></label>
      <button id="apply-bulk-state">Apply</button>
    </div>
    <div>
      <label>Bulk priority:<select id="bulk-priority">
        <option value="">Choose priority</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select></label>
      <button id="apply-bulk-priority">Apply</button>
    </div>
  </section>

  <section class="table-panel">
    <table id="task-table">
      <thead>
        <tr>
          <th><input id="select-all" type="checkbox" /></th>          <th data-sort="id">ID</th>          <th data-sort="property">Property</th>
          <th data-sort="interiorExterior">Interior/Exterior</th>
          <th data-sort="upstairsDownstairs">Up/Down</th>
          <th data-sort="area">Area</th>
          <th data-sort="category">Category</th>
          <th data-sort="description">Task Description</th>
          <th data-sort="priority">Priority</th>
          <th data-sort="order">Order</th>
          <th data-sort="cost">Cost</th>
          <th data-sort="state">State</th>
          <th data-sort="dateCompleted">Date Completed</th>
            <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="chart-grid">
    <div class="chart-card">
      <h2>Cost by Category</h2>
      <canvas id="cost-chart"></canvas>
    </div>
    <div class="chart-card">
      <h2>Tasks by Category</h2>
      <canvas id="count-chart"></canvas>
    </div>
  </section>

<div id="task-modal" class="modal hidden">
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title">Add Task</h2>
        <form id="task-form">
          <div class="form-grid">
            <label>Property<select name="property" required></select></label>
            <label>Interior/Exterior<select name="interiorExterior"></select></label>
            <label>Upstairs/Downstairs<select name="upstairsDownstairs"></select></label>
            <label>Area<select name="area"></select></label>
            <label>Category<select name="category"></select></label>
            <label>Task Description<textarea name="description" required></textarea></label>
            <label>Priority<select name="priority">
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
              </select></label>
            <label>Order<input name="order" /></label>
            <label>Cost ($)<input name="cost" type="number" step="0.01" min="0" /></label>
            <label>State<select name="state">
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Complete">Complete</option>
              </select></label>
          </div>
          <div class="form-actions">
            <button type="submit">Save Task</button>
            <button id="close-modal" type="button">Cancel</button>
          </div>
        </form>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
